[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["app/static/pdfjs", "venv", "build", "dist", "packaging/models"]

[tool.ruff.lint]
# Focus on correctness, not style. These catch real bugs without churning the
# existing vanilla codebase:
#   F     pyflakes  — undefined names, redefinitions, unused variables
#   E9    syntax errors
#   W6    deprecated constructs
# Intentionally NOT enabled yet (would require a large, risky cleanup pass):
#   F401  unused imports — several modules (e.g. app/database.py) re-export names,
#         so blanket removal breaks imports. Revisit with per-file ignores later.
#   I     import sorting, E501 line length — style only.
select = ["F", "E9", "W6"]
ignore = ["F401"]
