name: Windows Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Add Inno Setup to PATH
        shell: pwsh
        run: echo "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH

      - name: Build Windows app and installer
        shell: cmd
        # NOTE: GitHub Releases has a 2 GB per-file limit on free accounts.
        # The full bundle (~3-4 GB) cannot be uploaded as a release asset.
        # Build MINIMAL here; build the FULL bundle locally on a real Windows PC.
        # The build script exports MINIMAL_INSTALLER (the versioned exe path,
        # e.g. dist\TarCiteWorkspace_minimal-Setup_02.56.exe) via GITHUB_ENV.
        env:
          BUILD_VARIANT: minimal
          CI: "1"
        run: packaging\build_windows.bat

      - name: Sign Windows installer
        shell: pwsh
        env:
          WINDOWS_CODESIGN_PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 }}
          WINDOWS_CODESIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CODESIGN_PFX_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:WINDOWS_CODESIGN_PFX_PASSWORD)) {
            "WINDOWS_INSTALLER_SIGNING_STATUS=unsigned" | Out-File -FilePath $env:GITHUB_ENV -Append
            Write-Host "Windows signing secrets are not configured; installer remains unsigned."
            exit 0
          }

          $installer = $env:MINIMAL_INSTALLER
          if ([string]::IsNullOrWhiteSpace($installer)) {
            throw "MINIMAL_INSTALLER was not set by the build script"
          }
          if (!(Test-Path $installer)) {
            throw "Installer not found: $installer"
          }

          $windowsKits = "${env:ProgramFiles(x86)}\Windows Kits\10\bin"
          $signtool = Get-ChildItem $windowsKits -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match "\\x64\\signtool.exe$" } |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName

          if ([string]::IsNullOrWhiteSpace($signtool)) {
            throw "signtool.exe not found under $windowsKits"
          }

          $certPath = Join-Path $env:RUNNER_TEMP "windows-codesign.pfx"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_CODESIGN_PFX_BASE64))

          & $signtool sign `
            /fd SHA256 `
            /tr http://timestamp.digicert.com `
            /td SHA256 `
            /f $certPath `
            /p $env:WINDOWS_CODESIGN_PFX_PASSWORD `
            $installer

          & $signtool verify /pa /v $installer
          Remove-Item $certPath -Force

          "WINDOWS_INSTALLER_SIGNING_STATUS=signed" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Windows installer signed successfully."

      - name: Publish Windows installer release asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: windows-latest
          RELEASE_TITLE: TarCite Windows Latest
        run: |
          $ErrorActionPreference = "Stop"

          function Invoke-Gh {
            gh @args
            if ($LASTEXITCODE -ne 0) {
              throw "gh $($args -join ' ') failed with exit code $LASTEXITCODE"
            }
          }

          $assetPath = $env:MINIMAL_INSTALLER
          if ([string]::IsNullOrWhiteSpace($assetPath)) {
            throw "MINIMAL_INSTALLER was not set by the build script"
          }
          if (!(Test-Path $assetPath)) {
            throw "Installer not found: $assetPath"
          }

          if ($env:WINDOWS_INSTALLER_SIGNING_STATUS -eq "signed") {
            $signingNote = "The installer is code-signed by the configured Windows signing certificate."
          } else {
            $signingNote = "Windows may show `"Unknown publisher`" because the installer is not code-signed."
          }

          $notes = @"
          Latest Windows installer built from $env:GITHUB_SHA.

          **This is the MINIMAL installer** (~200 MB). AI models are downloaded on first run.
          For the FULL offline installer (models bundled, ~3-4 GB), build locally:
            packaging\build_windows.bat

          $signingNote
          See docs/WINDOWS_INSTALL_HELP.md for safe installation steps.
          "@

          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -ne 0) {
            Invoke-Gh release create $env:RELEASE_TAG $assetPath `
              --target $env:GITHUB_SHA `
              --title $env:RELEASE_TITLE `
              --notes $notes `
              --prerelease
          } else {
            Invoke-Gh release upload $env:RELEASE_TAG $assetPath --clobber
            Invoke-Gh release edit $env:RELEASE_TAG `
              --target $env:GITHUB_SHA `
              --title $env:RELEASE_TITLE `
              --notes $notes `
              --prerelease
          }
